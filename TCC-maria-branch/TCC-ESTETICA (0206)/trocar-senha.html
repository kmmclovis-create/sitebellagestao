<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacidade e Segurança | Bella Estética</title>

    <link rel="stylesheet" href="css/perfil.css">
    <link rel="stylesheet" href="css/editar-perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="header" id="header">
        <a href="index.html#home" class="logo">
            Bella<span>.</span>
        </a>

        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" class="menu-icon">
            <i class="fa-solid fa-bars"></i>
        </label>

        <nav class="navbar">
            <a href="index.html#home">Home</a>
            <a href="procedimentos.html">Procedimentos</a>
            <a href="loja.html">Loja</a>
            <a href="index.html#about">Sobre Nós</a>
            <a href="index.html#contact">Contato</a>
        </nav>
    </header>


    <!-- ==================================================
         CONTEÚDO
    ================================================== -->

    <main class="edit-profile-content">

        <a href="perfil.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Voltar para o perfil
        </a>

        <!-- ==============================================
             CARD 1: ALTERAR SENHA
        =============================================== -->
        <form class="edit-profile-card" id="formTrocarSenha">

            <h1>Privacidade e Segurança</h1>

            <p class="subtitle">
                Altere a senha usada para entrar na sua conta.
            </p>

            <div class="field-group">
                <label for="senhaAtual">Senha atual</label>
                <input
                    type="password"
                    id="senhaAtual"
                    name="senhaAtual"
                    placeholder="Digite sua senha atual"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="field-group">
                <label for="novaSenha">Nova senha</label>
                <input
                    type="password"
                    id="novaSenha"
                    name="novaSenha"
                    placeholder="Digite sua nova senha"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>

            <div class="field-group">
                <label for="confirmarSenha">Confirmar nova senha</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    name="confirmarSenha"
                    placeholder="Digite a nova senha novamente"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>

            <div class="edit-actions">
                <a href="perfil.html" class="cancel-button">Cancelar</a>
                <button type="submit" class="save-button">Salvar nova senha</button>
            </div>

        </form>



    </main>
<!-- ==============================================
     POP-UP / MODAL DE AVISO
=============================================== -->
<div id="modalAviso" class="modal-galeria" style="display: none;">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
        <i id="iconeAviso" class="fa-solid fa-circle-exclamation" style="font-size: 40px; color: #d9534f; margin-bottom: 15px;"></i>
        <h3 id="tituloAviso" style="margin-bottom: 10px; color: #333;">Atenção</h3>
        <p id="mensagemAviso" style="color: #666; margin-bottom: 20px;"></p>
        <button type="button" id="btnFecharAviso" class="save-button" style="width: 100%;">OK</button>
    </div>
</div>
    <!-- Scripts do Supabase e de segurança -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="javascript/supabase-config.js"></script>
    <script src="javascript/trocar-senha.js"></script>
    <script src="javascript/mascara-senha.js"></script>

</body>

</html>
