<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Perfil | Bella Estética</title>

    <link rel="stylesheet" href="css/perfil.css">
    <link rel="stylesheet" href="css/editar-perfil.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="header" id="header">

        <a href="index.html#home" class="logo">
            Bella<span>.</span>
        </a>

        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" class="menu-icon">
            <i class="fa-solid fa-bars"></i>
        </label>

        <nav class="navbar">
            <a href="index.html#home">Home</a>
            <a href="procedimentos.html">Procedimentos</a>
            <a href="loja.html">Loja</a>
            <a href="index.html#about">Sobre Nós</a>
            <a href="index.html#contact">Contato</a>
        </nav>

    </header>


    <!-- ==================================================
         CONTEÚDO
    ================================================== -->

    <main class="edit-profile-content">

        <a href="perfil.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Voltar para o perfil
        </a>

        <form class="edit-profile-card" id="formEditarPerfil">

            <h1>Editar Perfil</h1>

            <p class="subtitle">
                Atualize sua foto e suas informações pessoais.
            </p>

            <!-- ==============================================
                 FOTO
            =============================================== -->

           <div class="edit-photo-wrapper">

                <div class="profile-photo">

                    <img src="icons/userpadrao.jpg"
                        alt="Foto de perfil" id="fotoPreview">

                    <button class="edit-photo" id="btnEditarFoto" aria-label="Trocar foto" type="button">
                        <i class="fa-solid fa-pen"></i>
                    </button>

                </div>

                <p class="photo-hint">
                    Clique no lápis para trocar sua foto
                </p>

            </div>

            <!-- ==============================================
                 MODAL DE GALERIA DE AVATARES
            =============================================== -->
            <div id="modalGaleria" class="modal-galeria" style="display: none;">
                <div class="modal-content">
                    <h3>Escolha um Avatar</h3>
                    <p>Selecione uma imagem do nosso banco de imagens.</p>
                    
                    <div id="listaAvatares" class="grid-avatares"></div>
                    
                    <button type="button" id="btnFecharModal" class="cancel-button">Cancelar</button>
                </div>
            </div>
            <!-- ==============================================
                 CAMPOS
            =============================================== -->

            <div class="field-group">
                <label for="nome">Nome de usuário</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <!-- ==============================================
                 AÇÕES
            =============================================== -->

            <div class="edit-actions">
                <a href="perfil.html" class="cancel-button">Cancelar</a>
                <button type="submit" class="save-button">Salvar alterações</button>
            </div>

        </form>

    </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 1. O arquivo de configuração global -->
    <script src="javascript/supabase-config.js"></script>
    
    <!-- 2. O script da página de edição -->
    <script src="javascript/editar-perfil.js"></script>

</body>

</html>
