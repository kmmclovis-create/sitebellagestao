<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Bella Gestão</title>
    
    <!-- SDK do Supabase no Head (apenas o script de carregamento, sem módulos) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/agendamento.css">
</head>

<body>

    <header class="header" id="header">
        <a href="index.html#home" class="logo">Bella<span>.</span></a>

        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" class="menu-icon">
            <i class="fa-solid fa-bars"></i>
        </label>

        <nav class="navbar">
            <a href="index.html#home">Home</a>
            <a href="procedimentos.html">Procedimentos</a>
            <a href="agendamento.html" class="active">Agendamentos</a>
            <a href="loja.html">Loja</a>
            <a href="index.html#about">Sobre Nós</a>
            <a href="index.html#contact">Contato</a>
        </nav>

        <div class="header-icons">
            <a href="perfil.html" class="user-icon" id="linkPerfilHeader">
    <img src="icons/userpadrao.jpg" alt="Perfil" id="fotoHeader" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover;">
</a>
        </div>
    </header>

    <main class="agendamento-page">
        <div class="container">
            <div class="card">
                <div class="header-card">
                    <p class="section-label">AGENDAMENTO</p>
            <form class="form" id="agendamentoForm" autocomplete="off">
                    <h1>Novo Agendamento</h1>
                </div>

                <div class="content">
                    <aside class="sidebar">
                        <h2>Informações</h2>

                        <div class="procedure">
                            <label for="nome">Nome Cliente:</label>
                            <input placeholder="Digite seu nome" type="text" id="nome" name="nome" required>

                            <label for="email">Email:</label>
                            <input placeholder="ex: aaaaaa@gmail.com" id="email" name="email" type="email" required>

                            <label for="phone">Telefone:</label>
                            <input placeholder="ex: (11) 99999-9999" id="phone" name="phone" type="tel" pattern="[\(]\d{2}[\)]\s\d{4,5}-\d{4}" required>
                        </div>

                        <div class="info-box">
                            <h3>Detalhes</h3>

                            <p><strong>Procedimento:</strong> <span id="procedimento">--</span></p>
                            <p><strong>Duração:</strong> <span id="duracao">00:00</span></p>
                            <p><strong>Valor:</strong> <span id="valor">R$ 00,00</span></p>
                            <p><strong>Manutenção:</strong> <span id="retoque">sim/não</span></p>
                            <p><strong>Profissional:</strong> <span id="profissional">--</span></p>
                        </div>
                    </aside>

                    <main class="main">
                        <section class="calendar-section">
                            <h2>Selecione uma Data</h2>

                            <div class="calendar">
                                <div class="calendar-nav">
                                    <button type="button" id="btnMesAnterior" aria-label="Mês anterior">←</button>
                                    <div class="month" id="mesAtual"></div>
                                    <button type="button" id="btnMesProximo" aria-label="Próximo mês">→</button>
                                </div>

                                <div class="days-header">
                                    <div>Dom</div>
                                    <div>Seg</div>
                                    <div>Ter</div>
                                    <div>Qua</div>
                                    <div>Qui</div>
                                    <div>Sex</div>
                                    <div>Sáb</div>
                                </div>

                                <div class="days" id="diasCalendario"></div>
                            </div>
                        </section>

                        <section class="hours-section">
                            <h2>Horários Disponíveis</h2>

                            <div class="hours-grid">
                                <button class="hour" type="button">08:00</button>
                                <button class="hour" type="button">08:30</button>
                                <button class="hour" type="button">09:00</button>
                                <button class="hour" type="button">09:30</button>
                                <button class="hour" type="button">10:00</button>
                                <button class="hour selected" type="button">10:30</button>
                                <button class="hour" type="button">11:00</button>
                                <button class="hour" type="button">11:30</button>
                                <button class="hour" type="button">13:00</button>
                                <button class="hour" type="button">13:30</button>
                                <button class="hour" type="button">14:00</button>
                                <button class="hour" type="button">14:30</button>
                            </div>
                        </section>

                        <div class="footer">
                            <button id="btnConfirmar" class="confirm" type="button">
                                Confirmar Agendamento
                            </button>
                        </div>
                    </main>
                </div>
            </form>
            </div>
        </div>
    </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Configuração que cria o window.supabase global -->
    <script src="javascript/supabase-config.js"></script>
    
    <!-- 3. Header e Foto de Perfil -->
    <script src="javascript/global-header.js"></script>
    
    <!-- 4. Lógica de Agendamento -->
    <script src="javascript/agendamento.js"></script>
</body>
</html>
