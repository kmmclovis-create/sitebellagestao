<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/autenticacao.css">
    
    <title>Sucesso - Bella Gestão</title>
</head>

<body class="auth-page">

    <main class="auth-container">
        <section class="auth-card" style="text-align: center; padding: 3rem 2rem;">

            <a href="index.html" class="auth-brand" style="justify-content: center; margin-bottom: 1rem;">
                Bella<span>.</span>
            </a>

            <!-- Ícone de sucesso simples usando emoji (você pode trocar por uma imagem/svg) -->
            <div style="font-size: 4rem; margin: 10px 0;">✨</div>

            <h1 class="heading">
                Cadastro <span>Realizado!</span>
            </h1>

            <p class="section-description" style="margin-bottom: 2rem;">
                Sua conta foi criada com sucesso. Seja muito bem-vindo(a) à Bella Gestão! Agora você já pode acessar o sistema.
            </p>

            <a href="login.html" class="auth-submit" style="text-decoration: none; display: inline-block; text-align: center; width: 100%; box-sizing: border-box;">
                Fazer Login
            </a>

        </section>
    </main>

</body>
</html>
