<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meus Pedidos | Bella Estética</title>

    <link rel="stylesheet" href="css/pedidos.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="header" id="header">

        <a href="index.html#home" class="logo">
            Bella<span>.</span>
        </a>


        <input type="checkbox" id="menu-toggle">


        <label for="menu-toggle" class="menu-icon">
            <i class="fa-solid fa-bars"></i>
        </label>


        <nav class="navbar">

            <a href="index.html#home">Home</a>

            <a href="procedimentos.html">Procedimentos</a>

            <a href="loja.html">Loja</a>

            <a href="index.html#about">Sobre Nós</a>

            <a href="index.html#contact">Contato</a>

        </nav>

    </header>



    <!-- ==================================================
         CONTEÚDO
    ================================================== -->

    <main class="orders-content">


        <a href="perfil.html" class="back-link">
            <i class="fa-solid fa-chevron-left"></i>
            Voltar ao perfil
        </a>


        <!-- ==================================================
             TÍTULO
        ================================================== -->

        <section class="orders-title">

            <span class="title-decoration">
                <i class="fa-solid fa-truck-fast"></i>
            </span>

            <div>

                <h1>Meus Produtos</h1>

                <p>
                    Acompanhe o percurso dos produtos
                    que você comprou, do pedido até a sua casa.
                </p>

            </div>

        </section>



        <!-- ==================================================
             ABAS
        ================================================== -->

        <div class="orders-tabs">

            <button class="tab active" type="button" data-aba="andamento">
                A caminho
            </button>

            <button class="tab" type="button" data-aba="entregues">
                Entregues
            </button>

        </div>


<!-- ==================================================
             A CAMINHO
        ================================================== -->

        <section class="orders" id="abaAndamento">
            <!-- O JavaScript irá inserir os pedidos em andamento aqui -->
        </section>



        <!-- ==================================================
             ENTREGUES
        ================================================== -->

        <section class="orders" id="abaEntregues" hidden>
            <!-- O JavaScript irá inserir os pedidos entregues aqui -->
        </section>
     
       


    </main>

<!-- 1. SDK oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Configuração que cria a variável global window.supabase (ajuste o caminho se necessário) -->
    <script src="javascript/supabase-config.js"></script>
    
    <!-- 3. Lógica dos pedidos -->
    <script src="javascript/pedidos.js"></script>

</body>

</html>
